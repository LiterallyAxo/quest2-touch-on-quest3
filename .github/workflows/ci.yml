name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: |
          shellcheck -s busybox module/*.sh
          shellcheck build.sh

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: q2touch_on_q3
          path: q2touch_on_q3.zip
          if-no-files-found: error
          retention-days: 7
